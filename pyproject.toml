[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watching"
version = "0.1.0"
description = "Can language models learn to detect read-only activation probes?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.10.0",
    "transformers==5.18.0",
    "safetensors==0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.8", "accelerate>=1.1.0,<2"]
analysis = ["numpy>=2,<3", "scipy>=1.15,<2", "matplotlib>=3.9,<4"]

[project.scripts]
watching = "watching.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Archived run sources and audit code, kept byte-for-byte as run; their hashes are recorded.
extend-exclude = [
    "results/*/source",
    "results/*/scientific_source",
    "results/library-capture-compiled-libs/audit_native_vectors.py",
    "results/library-capture-training-061r-hidden/audit.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Archived CPU circuit-trace scripts.
"results/head6-circuit-cpu/scripts/*" = ["B023", "B905", "E501", "E741"]
# The CPU check as run, with its local model path.
"results/library-capture-compiled-libs/nnsight-12-calls-cpu/*" = ["E501"]
