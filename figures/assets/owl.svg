<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="feather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B07B55"/>
      <stop offset="1" stop-color="#7A4E34"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E603F"/>
      <stop offset="1" stop-color="#5E3B26"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.4" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBEFD9"/>
      <stop offset="1" stop-color="#EBD3AE"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#FFF6E6"/>
      <stop offset="1" stop-color="#EBD2AC"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#FFF0A8"/>
      <stop offset="0.5" stop-color="#FFC23C"/>
      <stop offset="1" stop-color="#E08A14"/>
    </radialGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC75A"/>
      <stop offset="1" stop-color="#E58A1F"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><path d="M120 42 C172 42 198 92 196 146 C194 196 162 222 120 222 C78 222 46 196 44 146 C42 92 68 42 120 42 Z"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <!-- ear tufts -->
    <path d="M64 82 L54 36 Q52 28 60 32 L104 60 Z" fill="url(#wing)" stroke="url(#wing)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M176 82 L186 36 Q188 28 180 32 L136 60 Z" fill="url(#wing)" stroke="url(#wing)" stroke-width="8" stroke-linejoin="round"/>
    <!-- body -->
    <path d="M120 42 C172 42 198 92 196 146 C194 196 162 222 120 222 C78 222 46 196 44 146 C42 92 68 42 120 42 Z" fill="url(#feather)"/>
  </g>

  <g clip-path="url(#body)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sheen)"/>
    <!-- belly with feather marks -->
    <ellipse cx="120" cy="178" rx="54" ry="54" fill="url(#belly)"/>
    <g fill="none" stroke="#C49A6C" stroke-width="3.2" stroke-linecap="round">
      <path d="M96 160 q6 6 12 0"/><path d="M114 160 q6 6 12 0"/><path d="M132 160 q6 6 12 0"/>
      <path d="M86 178 q6 6 12 0"/><path d="M104 178 q6 6 12 0"/><path d="M122 178 q6 6 12 0"/><path d="M140 178 q6 6 12 0"/>
      <path d="M96 196 q6 6 12 0"/><path d="M114 196 q6 6 12 0"/><path d="M132 196 q6 6 12 0"/>
    </g>
    <!-- wings -->
    <path d="M44 118 C34 160 46 202 92 222 C66 190 60 152 70 116 Z" fill="url(#wing)"/>
    <path d="M196 118 C206 160 194 202 148 222 C174 190 180 152 170 116 Z" fill="url(#wing)"/>
  </g>

  <!-- facial disc -->
  <path d="M120 82 C108 66 52 66 52 108 C52 142 86 150 120 136 C154 150 188 142 188 108 C188 66 132 66 120 82 Z" fill="url(#disc)"/>

  <!-- eyes -->
  <g>
    <circle cx="88" cy="108" r="27" fill="#5A3A26"/>
    <circle cx="88" cy="108" r="24" fill="url(#iris)"/>
    <circle cx="88" cy="109" r="13" fill="#1A1310"/>
    <circle cx="81" cy="101" r="5.5" fill="#FFFFFF"/>
    <circle cx="94" cy="116" r="2.4" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <circle cx="152" cy="108" r="27" fill="#5A3A26"/>
    <circle cx="152" cy="108" r="24" fill="url(#iris)"/>
    <circle cx="152" cy="109" r="13" fill="#1A1310"/>
    <circle cx="145" cy="101" r="5.5" fill="#FFFFFF"/>
    <circle cx="158" cy="116" r="2.4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- brows -->
  <path d="M62 76 Q86 66 112 84" fill="none" stroke="#7A4E34" stroke-width="6" stroke-linecap="round"/>
  <path d="M178 76 Q154 66 128 84" fill="none" stroke="#7A4E34" stroke-width="6" stroke-linecap="round"/>

  <!-- beak -->
  <path d="M110 128 Q120 120 130 128 Q126 142 120 152 Q114 142 110 128 Z" fill="url(#beak)"/>
  <ellipse cx="116" cy="129" rx="3" ry="1.6" fill="#FFFFFF" opacity="0.7"/>

  <!-- feet -->
  <g fill="#F2A541">
    <ellipse cx="98" cy="222" rx="6" ry="5"/><ellipse cx="108" cy="224" rx="6" ry="5"/><ellipse cx="88" cy="224" rx="6" ry="5"/>
    <ellipse cx="142" cy="222" rx="6" ry="5"/><ellipse cx="132" cy="224" rx="6" ry="5"/><ellipse cx="152" cy="224" rx="6" ry="5"/>
  </g>
</svg>
