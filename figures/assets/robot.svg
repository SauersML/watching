<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#EEF1F7"/>
      <stop offset="1" stop-color="#D3DAE7"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#9AA6BE" stop-opacity="0"/>
      <stop offset="1" stop-color="#7C89A4" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#344062"/>
      <stop offset="1" stop-color="#141A2C"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7DEEA"/>
      <stop offset="1" stop-color="#A5B0C6"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B7C1D3"/>
      <stop offset="0.5" stop-color="#E4E9F2"/>
      <stop offset="1" stop-color="#A9B4C8"/>
    </linearGradient>
    <radialGradient id="bulb" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#FFF4C7"/>
      <stop offset="0.45" stop-color="#FFC24A"/>
      <stop offset="1" stop-color="#F2703B"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#F2FDFF"/>
      <stop offset="0.45" stop-color="#8FE3FF"/>
      <stop offset="1" stop-color="#2E9BEA"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="screenClip"><rect x="58" y="88" width="124" height="84" rx="32"/></clipPath>
  </defs>

  <!-- antenna -->
  <circle cx="120" cy="28" r="20" fill="#FFB547" opacity="0.45" filter="url(#glow)"/>
  <rect x="114" y="34" width="12" height="30" rx="6" fill="url(#stem)"/>
  <circle cx="120" cy="28" r="13" fill="url(#bulb)"/>
  <ellipse cx="115.5" cy="23" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.85"/>

  <!-- ears -->
  <rect x="20" y="104" width="30" height="60" rx="14" fill="url(#ear)"/>
  <rect x="190" y="104" width="30" height="60" rx="14" fill="url(#ear)"/>
  <rect x="27" y="122" width="10" height="24" rx="5" fill="#FF8A65"/>
  <rect x="203" y="122" width="10" height="24" rx="5" fill="#FF8A65"/>

  <!-- head -->
  <g filter="url(#drop)">
    <rect x="38" y="58" width="164" height="144" rx="52" fill="url(#shell)"/>
  </g>
  <rect x="38" y="58" width="164" height="144" rx="52" fill="url(#rim)"/>
  <ellipse cx="98" cy="72" rx="44" ry="7" fill="#FFFFFF" opacity="0.95" filter="url(#soft)"/>

  <!-- face screen -->
  <rect x="58" y="88" width="124" height="84" rx="32" fill="url(#screen)"/>
  <g clip-path="url(#screenClip)">
    <path d="M58 88 H182 V112 Q120 100 58 124 Z" fill="#FFFFFF" opacity="0.07"/>
  </g>
  <rect x="58" y="88" width="124" height="84" rx="32" fill="none" stroke="#0E1322" stroke-opacity="0.35" stroke-width="2"/>

  <!-- eyes -->
  <ellipse cx="96" cy="126" rx="13" ry="17" fill="#55C8FF" opacity="0.55" filter="url(#glow)"/>
  <ellipse cx="144" cy="126" rx="13" ry="17" fill="#55C8FF" opacity="0.55" filter="url(#glow)"/>
  <ellipse cx="96" cy="126" rx="11" ry="15" fill="url(#eye)"/>
  <ellipse cx="144" cy="126" rx="11" ry="15" fill="url(#eye)"/>
  <circle cx="92.5" cy="120" r="3.6" fill="#FFFFFF"/>
  <circle cx="140.5" cy="120" r="3.6" fill="#FFFFFF"/>

  <!-- cheeks and smile -->
  <ellipse cx="74" cy="152" rx="9" ry="5" fill="#FF8FA3" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="166" cy="152" rx="9" ry="5" fill="#FF8FA3" opacity="0.55" filter="url(#soft)"/>
  <path d="M108 150 Q120 160 132 150" fill="none" stroke="#55C8FF" stroke-width="6" stroke-linecap="round" opacity="0.5" filter="url(#soft)"/>
  <path d="M108 150 Q120 160 132 150" fill="none" stroke="#A6EBFF" stroke-width="4.5" stroke-linecap="round"/>
</svg>
