<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC27A"/>
      <stop offset="0.6" stop-color="#F7A050"/>
      <stop offset="1" stop-color="#E88438"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.38" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9A8A0"/>
      <stop offset="1" stop-color="#FCD3C6"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#FCE9D2"/>
    </linearGradient>
    <radialGradient id="iris" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#E6F59A"/>
      <stop offset="0.5" stop-color="#A8CF45"/>
      <stop offset="1" stop-color="#5F8F1E"/>
    </radialGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9AA2"/>
      <stop offset="1" stop-color="#E86A78"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="head"><path d="M120 62 C178 62 208 100 208 140 C208 186 170 210 120 210 C70 210 32 186 32 140 C32 100 62 62 120 62 Z"/></clipPath>
  </defs>

  <g filter="url(#drop)">
    <!-- ears -->
    <path d="M44 120 L52 40 Q55 28 66 34 L124 80 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M196 120 L188 40 Q185 28 174 34 L116 80 Z" fill="url(#fur)" stroke="url(#fur)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M58 104 L62 50 L106 82 Z" fill="url(#earIn)" stroke="url(#earIn)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M182 104 L178 50 L134 82 Z" fill="url(#earIn)" stroke="url(#earIn)" stroke-width="6" stroke-linejoin="round"/>
    <!-- head -->
    <path d="M120 62 C178 62 208 100 208 140 C208 186 170 210 120 210 C70 210 32 186 32 140 C32 100 62 62 120 62 Z" fill="url(#fur)"/>
  </g>

  <g clip-path="url(#head)">
    <rect x="0" y="0" width="240" height="240" fill="url(#sheen)"/>
    <!-- tabby stripes -->
    <path d="M120 64 Q114 80 120 96 Q126 80 120 64 Z" fill="#D9672A" opacity="0.75"/>
    <path d="M100 66 Q92 80 98 92 Q104 80 106 66 Z" fill="#D9672A" opacity="0.6"/>
    <path d="M140 66 Q148 80 142 92 Q136 80 134 66 Z" fill="#D9672A" opacity="0.6"/>
    <path d="M30 126 Q46 122 58 128 Q46 130 30 134 Z" fill="#D9672A" opacity="0.55"/>
    <path d="M30 146 Q44 142 54 148 Q44 150 30 154 Z" fill="#D9672A" opacity="0.5"/>
    <path d="M210 126 Q194 122 182 128 Q194 130 210 134 Z" fill="#D9672A" opacity="0.55"/>
    <path d="M210 146 Q196 142 186 148 Q196 150 210 154 Z" fill="#D9672A" opacity="0.5"/>
    <!-- muzzle and chin -->
    <ellipse cx="120" cy="196" rx="44" ry="26" fill="url(#cream)"/>
    <ellipse cx="102" cy="168" rx="25" ry="19" fill="url(#cream)"/>
    <ellipse cx="138" cy="168" rx="25" ry="19" fill="url(#cream)"/>
  </g>

  <!-- blush -->
  <ellipse cx="66" cy="160" rx="13" ry="7" fill="#FF8C8C" opacity="0.4" filter="url(#soft)"/>
  <ellipse cx="174" cy="160" rx="13" ry="7" fill="#FF8C8C" opacity="0.4" filter="url(#soft)"/>

  <!-- eyes -->
  <g>
    <ellipse cx="84" cy="130" rx="17" ry="19" fill="#3B2A1F"/>
    <ellipse cx="84" cy="130" rx="15" ry="17" fill="url(#iris)"/>
    <ellipse cx="84" cy="131" rx="5.5" ry="13" fill="#1C1612"/>
    <circle cx="79" cy="123" r="5" fill="#FFFFFF"/>
    <circle cx="89" cy="138" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g>
    <ellipse cx="156" cy="130" rx="17" ry="19" fill="#3B2A1F"/>
    <ellipse cx="156" cy="130" rx="15" ry="17" fill="url(#iris)"/>
    <ellipse cx="156" cy="131" rx="5.5" ry="13" fill="#1C1612"/>
    <circle cx="151" cy="123" r="5" fill="#FFFFFF"/>
    <circle cx="161" cy="138" r="2.2" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- nose and mouth -->
  <path d="M110 154 Q120 150 130 154 Q127 162 120 165 Q113 162 110 154 Z" fill="url(#nose)"/>
  <ellipse cx="117" cy="155" rx="3" ry="1.6" fill="#FFFFFF" opacity="0.7"/>
  <path d="M120 165 V171 M106 171 Q113 180 120 171 Q127 180 134 171" fill="none" stroke="#6B3E2A" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- whiskers -->
  <g stroke="#6B3E2A" stroke-width="2.4" stroke-linecap="round" opacity="0.55" fill="none">
    <path d="M86 166 Q60 160 34 162"/>
    <path d="M86 173 Q62 174 38 182"/>
    <path d="M154 166 Q180 160 206 162"/>
    <path d="M154 173 Q178 174 202 182"/>
  </g>
</svg>
