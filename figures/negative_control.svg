  </g>
  <g id="text_9">
   <text style="font-weight: 700; font-size: 26px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #203c41" x="43.74" y="45.675938" transform="rotate(-0 43.74 45.675938)">A no-signal control must not learn the labels.</text>
  </g>
  <g id="text_10">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667a7c" x="43.74" y="68.957812" transform="rotate(-0 43.74 68.957812)">Give both training conditions exactly the same cached activations.</text>
  </g>
  <g id="text_11">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667a7c" x="43.74" y="403.92" transform="rotate(-0 43.74 403.92)">Best balanced binary loss: ln(2). Any apparent detection calls for a leakage or scoring audit.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #667a7c" x="43.74" y="421.2" transform="rotate(-0 43.74 421.2)">Control design—not a measured result. Labels enter the loss, never the model input.</text>
  </g>
