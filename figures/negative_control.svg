   <g id="text_8">
    <text style="font-weight: 700; font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #203c41" x="490.86" y="369.716484" transform="rotate(-0 490.86 369.716484)">No condition information is available</text>
