<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html, body { margin: 0; background: transparent; overflow: hidden; }</style>
</head>
<body>
<script src="vendor/p5.brush-2.2.3.js"></script>
<script>
// Hand-painted characters for the README figures, made with p5.brush.
// Canvas origin is the centre; y grows downward. Open with #robot, #cat or #owl.
const INK = "#2A1F1A";
const SIZE = 600;

function ellipsePoints(cx, cy, rx, ry, n = 56, rot = 0) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const x = rx * Math.cos(a);
    const y = ry * Math.sin(a);
    pts.push([cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]);
  }
  return pts;
}

function roundedRect(x0, y0, x1, y1, r, n = 12) {
  const pts = [];
  const corners = [
    [x1 - r, y0 + r, -Math.PI / 2],
    [x1 - r, y1 - r, 0],
    [x0 + r, y1 - r, Math.PI / 2],
    [x0 + r, y0 + r, Math.PI],
  ];
  for (const [cx, cy, a0] of corners) {
    for (let i = 0; i <= n; i++) {
      const a = a0 + (i / n) * (Math.PI / 2);
      pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
    }
  }
  return pts;
}

function shade(hex, k) {
  const v = parseInt(hex.slice(1), 16);
  const c = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map((x) => Math.round(x * k));
  return "#" + c.map((x) => Math.max(0, Math.min(255, x)).toString(16).padStart(2, "0")).join("");
}

// A light flat base so the colour stays saturated, then wet watercolour on top.
function watercolor(points, color, { base = 150, layers = 2, bleed = 0.12 } = {}) {
  brush.noStroke();
  brush.noFill();
  if (base) {
    brush.wash(shade(color, 1.08), base);
    brush.polygon(points);
    brush.noWash();
  }
  for (let i = 0; i < layers; i++) {
    brush.fill(i ? shade(color, 0.9) : color, 120);
    brush.fillBleed(bleed, "out");
    brush.fillTexture(0.75, 0.55);
    brush.polygon(points);
    brush.noFill();
  }
}

function outline(points, weight = 3.6, closed = true) {
  brush.noFill();
  brush.noWash();
  brush.set("pen", INK, weight);
  brush.spline(closed ? [...points, points[0], points[1]] : points, 0.5);
}

function stroke(points, weight, color, kind = "marker") {
  brush.noFill();
  brush.noWash();
  brush.set(kind, color, weight);
  brush.spline(points, 0.6);
}

// Parallel curved brushstrokes across an ellipse, like fur or feathers.
function brushwork(cx, cy, rx, ry, color, { rows = 9, weight = 1.4, bow = 0.12, kind = "crayon" } = {}) {
  for (let i = 0; i < rows; i++) {
    const t = -0.85 + (1.7 * (i + 0.5)) / rows;
    const half = Math.sqrt(1 - t * t) * 0.86;
    const y = cy + t * ry;
    const pts = [];
    for (let k = 0; k <= 6; k++) {
      const u = -half + (2 * half * k) / 6;
      pts.push([cx + u * rx + brush.random(-4, 4), y + bow * ry * (1 - u * u) + brush.random(-3, 3)]);
    }
    stroke(pts, weight * brush.random(0.8, 1.2), color, kind);
  }
}

function blob(x, y, r, color, opacity = 255) {
  brush.noStroke();
  brush.noFill();
  brush.wash(color, opacity);
  brush.polygon(ellipsePoints(x, y, r, r, 40));
  brush.noWash();
}

function bigEye(x, y, r) {
  blob(x, y, r, "#1E1714");
  blob(x - r * 0.3, y - r * 0.34, r * 0.36, "#FFFFFF");
  blob(x + r * 0.36, y + r * 0.3, r * 0.15, "#FFFFFF");
  outline(ellipsePoints(x, y, r, r, 40), 1.6);
}

function robot() {
  // antenna
  brush.set("pen", INK, 3.4);
  brush.line(0, -150, 0, -214);
  blob(0, -230, 26, "#F2794E");
  outline(ellipsePoints(0, -230, 26, 26, 32), 2);
  // ears
  for (const s of [-1, 1]) {
    const ear = roundedRect(s > 0 ? 152 : -208, -66, s > 0 ? 208 : -152, 52, 24);
    watercolor(ear, "#F2794E", { layers: 1 });
    outline(ear);
  }
  // head
  const head = roundedRect(-170, -160, 170, 170, 78);
  watercolor(head, "#F3F6FA", { base: 255, layers: 0, bleed: 0 });
  brushwork(0, 10, 160, 150, "#D3DCE8", { rows: 9, weight: 1.3, bow: 0.05, kind: "cpencil" });
  outline(head, 4);
  // face screen
  const screen = roundedRect(-130, -110, 130, 116, 58);
  watercolor(screen, "#23324A", { base: 255, layers: 1, bleed: 0.02 });
  outline(screen, 2.2);
  // big glowing eyes
  for (const s of [-1, 1]) {
    blob(s * 60, -6, 50, "#3FA9E0");
    blob(s * 60, -6, 42, "#7FDBFF");
    blob(s * 60 - 16, -24, 15, "#FFFFFF");
    blob(s * 60 + 18, 12, 6, "#FFFFFF");
  }
  stroke([[-34, 66], [0, 84], [34, 66]], 4.4, "#7FDBFF", "pen");
}

function cat() {
  const fur = "#F0913A";
  const dark = "#C65F1C";
  for (const s of [-1, 1]) {
    const ear = [[s * 196, 10], [s * 166, -236], [s * 34, -124]];
    watercolor(ear, fur);
    watercolor([[s * 160, -50], [s * 152, -186], [s * 84, -128]], "#F4A9A0", { base: 200, layers: 1 });
    outline([...ear, ear[0]], 4, false);
  }
  const head = ellipsePoints(0, 48, 214, 184, 72);
  watercolor(head, fur, { base: 170 });
  brushwork(0, 48, 214, 184, shade(fur, 0.82), { rows: 14, weight: 1.5, bow: 0.1 });
  brushwork(-20, 10, 150, 120, "#FFC98A", { rows: 6, weight: 1.6, bow: 0.12, kind: "pastel" });
  for (const [x0, x1] of [[0, 0], [-48, -40], [48, 40]]) {
    stroke([[x0, -128], [(x0 + x1) / 2, -104], [x1, -78]], 4.2, dark, "crayon");
  }
  for (const s of [-1, 1]) {
    for (const dy of [0, 26]) stroke([[s * 212, 30 + dy], [s * 186, 34 + dy], [s * 162, 42 + dy]], 3.6, dark, "crayon");
  }
  watercolor(ellipsePoints(0, 132, 104, 68, 48), "#FFF4E6", { base: 230, layers: 1, bleed: 0.05 });
  outline(head, 4);
  bigEye(-82, 26, 52);
  bigEye(82, 26, 52);
  blob(0, 96, 15, "#E2626F");
  brush.set("pen", INK, 2.6);
  brush.line(0, 110, 0, 126);
  stroke([[-34, 124], [-17, 142], [0, 126]], 2.6, INK, "pen");
  stroke([[34, 124], [17, 142], [0, 126]], 2.6, INK, "pen");
  for (const s of [-1, 1]) {
    stroke([[s * 118, 112], [s * 180, 102], [s * 244, 98]], 1.6, INK, "pen");
    stroke([[s * 118, 132], [s * 182, 134], [s * 246, 144]], 1.6, INK, "pen");
  }
}

function owl() {
  const brown = "#A86536";
  const dark = "#6B3D21";
  for (const s of [-1, 1]) {
    const tuft = [[s * 158, -96], [s * 186, -252], [s * 72, -162]];
    watercolor(tuft, dark);
    outline([...tuft, tuft[0]], 4, false);
  }
  const body = ellipsePoints(0, 40, 194, 252, 72);
  watercolor(body, brown, { base: 170 });
  brushwork(0, 40, 194, 252, shade(brown, 0.78), { rows: 18, weight: 1.5, bow: 0.08 });
  brushwork(-20, -20, 140, 160, "#D59A66", { rows: 6, weight: 1.6, bow: 0.1, kind: "pastel" });
  for (const s of [-1, 1]) {
    const wing = ellipsePoints(s * 172, 104, 64, 148, 48, s * -0.22);
    watercolor(wing, dark);
    for (let k = 0; k < 4; k++) {
      stroke([[s * (150 + k * 10), 30 + k * 34], [s * (176 + k * 6), 70 + k * 34], [s * (196 + k * 2), 110 + k * 34]], 2.6, shade(dark, 0.75));
    }
    outline(wing, 3.6);
  }
  watercolor(ellipsePoints(0, 140, 124, 130, 56), "#F3DFBF", { base: 220, layers: 1, bleed: 0.06 });
  for (const [y, xs] of [[92, [-56, 0, 56]], [140, [-84, -28, 28, 84]], [188, [-56, 0, 56]]]) {
    for (const x of xs) stroke([[x - 20, y], [x, y + 15], [x + 20, y]], 2.6, "#A06A3C", "crayon");
  }
  outline(body, 4);
  for (const s of [-1, 1]) {
    const disc = ellipsePoints(s * 78, -50, 82, 82, 56);
    watercolor(disc, "#FCF1DF", { base: 255, layers: 1, bleed: 0.03 });
    outline(disc, 2.2);
    blob(s * 78, -50, 62, "#F5A623");
    bigEye(s * 78, -50, 44);
  }
  const beak = [[-24, 14], [24, 14], [0, 58]];
  watercolor(beak, "#EE8A2B", { base: 230, layers: 1 });
  outline([...beak, beak[0]], 2.2, false);
  for (const s of [-1, 1]) {
    for (const k of [-1, 0, 1]) {
      blob(s * 66 + k * 22, 290, 15, "#EE8A2B");
      outline(ellipsePoints(s * 66 + k * 22, 290, 15, 15, 24), 1.6);
    }
  }
}

const name = (location.hash || "#robot").slice(1);
brush.createCanvas(SIZE, SIZE);
brush.clear();
brush.seed(21);
brush.noiseSeed(21);
brush.scaleBrushes(3);
brush.wiggle(0.6);
({ robot, cat, owl })[name]();
brush.render();
document.title = "done";
</script>
</body>
</html>
